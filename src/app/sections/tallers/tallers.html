<section class="tallers seccio" id="tallers">
  <div class="shell shell--estret">
    <div class="tallers__grid">
      <div class="tallers__intro" appReveal>
        <p class="eyebrow">{{ 'tallers.eyebrow' | translate }}</p>

        <h2 class="titol">{{ 'tallers.titol' | translate }}</h2>

        <p class="tallers__text">{{ 'tallers.text' | translate }}</p>

        <p class="tallers__nota">{{ 'tallers.nota' | translate }}</p>

        <p class="tallers__nota">{{ 'tallers.acompanyament' | translate }}</p>

        <a class="cta cta--contorn tallers__cta" href="#contacte" appIntencio="taller">
          {{ 'tallers.cta' | translate }} <span aria-hidden="true">→</span>
        </a>
      </div>

      <div class="tallers__mosaic cascada" appProgres>
        <figure class="tessella">
          <div class="tessella__marc">
            <img
              ngSrc="taller-modelant-textura"
              fill
              sizes="(min-width: 768px) 24vw, 50vw"
              [alt]="'tallers.altModelant' | translate"
            />
          </div>
        </figure>

        <figure class="tessella">
          <div class="tessella__marc">
            <img
              ngSrc="taller-obra-terracota"
              fill
              sizes="(min-width: 768px) 24vw, 50vw"
              [alt]="'tallers.altObraTerracota' | translate"
            />
          </div>
        </figure>

        <figure class="tessella">
          <div class="tessella__marc">
            <img
              ngSrc="taller-empremtes-peuets"
              fill
              sizes="(min-width: 768px) 24vw, 50vw"
              [alt]="'tallers.altPeuets' | translate"
            />
          </div>
        </figure>

        <figure class="tessella">
          <div class="tessella__marc">
            <img
              ngSrc="taller-obra-coure"
              fill
              sizes="(min-width: 768px) 24vw, 50vw"
              [alt]="'tallers.altObraCoure' | translate"
            />
          </div>
        </figure>
      </div>
    </div>
  </div>
</section>
