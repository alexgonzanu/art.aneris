# Com es construeix i com se serveix la landing.
#
# Les credencials del correu no viuen aquí: van a les variables d'entorn del
# panell de Netlify. Mira l'apartat «Formulari de contacte» del README.

[build]
  command = "npm run build"
  publish = "dist/art.aneris/browser"

[build.environment]
  # El detector de secrets de Netlify busca pels fitxers el valor de qualsevol
  # variable d'entorn, i el de SMTP_HOST surt a la documentació —que és on ha
  # de sortir: «smtp.gmail.com» és una adreça pública de Google, no cap
  # credencial. L'únic secret de debò és SMTP_PASS, i aquest se segueix
  # vigilant, igual que SMTP_USER i CORREU_DESTI.
  SECRETS_SCAN_OMIT_KEYS = "SMTP_HOST"

# El lloc també es podria veure sencer per l'adreça que Netlify li dona de
# fàbrica, i llavors hi hauria dues webs iguals a internet i Google no sabria
# quina és la bona. Netlify redirigeix sol entre l'apex i el www, però des del
# seu subdomini no: s'hi ha de posar a mà. Va primer de tot perquè ha d'atrapar
# qualsevol adreça, també les de sota.
[[redirects]]
  from = "https://artaneris.netlify.app/*"
  to = "https://artaneris.com/:splat"
  status = 301
  force = true

# El formulari crida /api/contacte, que és una adreça neta i del mateix domini:
# així no hi ha CORS pel mig. Ha d'anar abans del comodí de sota, que si no se
# l'empassa ell.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# La landing és una sola pàgina: qualsevol adreça que no existeixi torna
# l'index amb un 200 i no un 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
